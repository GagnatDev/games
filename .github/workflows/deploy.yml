# Build the image, push it to the homectl registry, roll it out on Kapsule.
# Pattern: homectl-reference/templates/github-workflows/deploy.yml.
#
# Required repo secrets: SCW_ACCESS_KEY, SCW_SECRET_KEY, SCW_ORGANIZATION_ID,
# SCW_PROJECT_ID, K8S_CLUSTER_ID.
name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-k8s-games
  cancel-in-progress: true

env:
  IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Build and push image
        run: |
          echo "${{ secrets.SCW_SECRET_KEY }}" | docker login rg.fr-par.scw.cloud \
            -u nologin --password-stdin
          docker build \
            -t rg.fr-par.scw.cloud/homectl/games:${{ env.IMAGE_TAG }} \
            -t rg.fr-par.scw.cloud/homectl/games:latest .
          docker push rg.fr-par.scw.cloud/homectl/games:${{ env.IMAGE_TAG }}
          docker push rg.fr-par.scw.cloud/homectl/games:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Setup Scaleway CLI and get kubeconfig
        uses: scaleway/action-scw@v0
        with:
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-organization-id: ${{ secrets.SCW_ORGANIZATION_ID }}
          default-project-id: ${{ secrets.SCW_PROJECT_ID }}
          args: k8s kubeconfig install ${{ secrets.K8S_CLUSTER_ID }} region=fr-par

      - name: Deploy to cluster
        run: |
          sed -i "s|\$IMAGE_TAG|${{ env.IMAGE_TAG }}|g" k8s/deployment.yml
          kubectl apply -f k8s/deployment.yml
          # The startup probe allows ~5 min for first boot + migrations.
          kubectl rollout status deployment/games -n homectl --timeout=300s
